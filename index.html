<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paul of Tarsus — A Life in Journeys</title>
<meta name="description" content="An interactive map and timeline of the life of the apostle Paul: 50 events from birth in Tarsus to martyrdom in Rome, with journeys, Roman provinces c. AD 50, and the scripture behind each stop.">
<meta name="author" content="Tim Anderson">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --font-display:'Playfair Display',Georgia,serif;
    --font-body:'Source Serif 4',Georgia,serif;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --sea:#c8d6d8; --paper:#f7f5f0; --ink:#2a2a2a;
  }
  html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--font-body)}
  body{display:flex;flex-direction:column;overflow:hidden}

  /* Dragging to pan, or double-clicking to zoom, otherwise smears a selection
     across every place label it touches. Chrome is unselectable by default; the
     panel's reading text opts back in below so quotes and refs stay copyable. */
  body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #panel h2,#panel .placeline,#panel .prose,#panel .altview,#panel .wright,
  #panel .lettersline,#panel .refs,#legend .note{-webkit-user-select:text;user-select:text}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:0.55rem 1.1rem;background:#2a2a2a;color:#f7f5f0;flex:none;flex-wrap:wrap}
  .topbar .crumbs{font-family:var(--font-ui);font-size:0.82rem;display:flex;align-items:center;gap:0.5rem;white-space:nowrap}
  .topbar .crumbs a{color:#b8b3a8;text-decoration:none}
  .topbar .crumbs a:hover{color:#f7f5f0}
  .topbar .crumbs .title{font-family:var(--font-display);font-weight:700;font-size:1rem;color:#f7f5f0}
  .layers{display:flex;gap:0.9rem;align-items:center;font-family:var(--font-ui);font-size:0.74rem;color:#d8d3c8;flex-wrap:wrap}
  .layers label{display:flex;gap:0.3rem;align-items:center;cursor:pointer;user-select:none}
  .layers input{accent-color:#a08c5b}

  #main{flex:1;display:flex;min-height:0}
  #mapwrap{flex:1;position:relative;background:var(--sea);min-width:0}
  #map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #map.dragging{cursor:grabbing}

  #yearbox{position:absolute;top:12px;right:14px;pointer-events:none;text-align:right}
  #yearbox .yr{font-family:var(--font-display);font-weight:700;font-size:2rem;color:#3d3428;line-height:1}
  #yearbox .ph{font-family:var(--font-ui);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:#6b6358;margin-top:2px}

  #zoomctl{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px}
  #zoomctl button{width:30px;height:30px;border:1px solid #a89a7d;border-radius:5px;background:#f7f5f0e6;
    color:#3d3428;font-family:var(--font-ui);font-size:1rem;cursor:pointer;line-height:1}
  #zoomctl button:hover{background:#efe6d2}

  #legend{position:absolute;left:12px;bottom:10px;background:#f7f5f0f2;border:1px solid #c9bfa8;border-radius:7px;
    font-family:var(--font-ui);font-size:0.68rem;color:#4a4437;max-width:250px;box-shadow:0 2px 8px #0002}
  #legend summary{padding:0.4rem 0.7rem;font-weight:600;font-size:0.72rem;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;color:#6b6358}
  #legend .body{padding:0.15rem 0.7rem 0.6rem;display:flex;flex-direction:column;gap:3px}
  #legend .row{display:flex;align-items:center;gap:7px}
  #legend .sw{flex:none;width:22px;height:0;border-top:3px solid}
  #legend .sw.dash{border-top-style:dashed;border-top-width:2px}
  #legend .box{flex:none;width:13px;height:11px;border:1px solid #0002}
  #legend .sec{margin-top:5px;font-weight:600;font-size:0.62rem;letter-spacing:0.07em;text-transform:uppercase;color:#8a8275}
  #legend .note{margin-top:6px;font-size:0.62rem;color:#8a8275;line-height:1.45}
  #legend svg{flex:none}

  #ptip{position:absolute;pointer-events:none;display:none;background:#2f2a22f0;color:#f1ead9;border-radius:6px;
    padding:0.45rem 0.65rem;font-family:var(--font-ui);font-size:0.7rem;max-width:260px;line-height:1.5;z-index:30}
  #ptip .nm{font-weight:700;letter-spacing:0.06em}
  #ptip .st{color:#cdbd97;font-size:0.64rem;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:2px}

  /* ---------- detail panel ---------- */
  #panel{width:390px;flex:none;background:var(--paper);border-left:1px solid #ddd5c4;display:flex;flex-direction:column;min-height:0}
  #panel .phead{flex:none;padding:0.85rem 1.1rem 0.7rem;border-bottom:1px solid #e6dfd0}
  #panel .datechip{display:inline-block;font-family:var(--font-mono);font-size:0.7rem;font-weight:600;color:#f7f5f0;
    padding:0.15rem 0.5rem;border-radius:4px;margin-bottom:0.45rem}
  #panel h2{font-family:var(--font-display);font-weight:700;font-size:1.28rem;line-height:1.25;color:#1a1a1a}
  #panel .placeline{font-family:var(--font-ui);font-size:0.78rem;color:#6b6358;margin-top:0.3rem}
  #panel .placeline b{color:#3d3428;font-weight:600}
  #panel .distline{display:flex;flex-wrap:wrap;gap:6px;margin-top:0.5rem}
  #panel .distline > span{font-family:var(--font-ui);font-size:0.68rem;font-weight:600;letter-spacing:0.02em;
    padding:0.16rem 0.5rem;border-radius:99px;white-space:nowrap}
  #panel .distline .dseg{background:#eae2cf;color:#5a4e38;border:1px solid #d9cdb2}
  #panel .distline .dseg.dstay{background:#eee9dc;color:#8a8275;font-weight:500;font-style:italic}
  #panel .distline .dsum{background:#3d3428;color:#f1ead9;white-space:normal}
  #panel .distline .dsum b{color:#e7c98c;font-weight:700}
  #panel .distline .dsum .dl,#panel .distline .dsum .ds{font-size:0.64rem;font-weight:600}
  #panel .distline .dsum .dl{color:#e7c98c}
  #panel .distline .dsum .ds{color:#9fc3d4}
  #panel .distline .dsum .sep{color:#8a8275;font-weight:400;margin:0 1px}
  #panel .pbody{flex:1;overflow-y:auto;padding:0.9rem 1.1rem 1.2rem}
  #panel .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:0.7rem}
  #panel .badge{font-family:var(--font-ui);font-size:0.66rem;font-weight:600;letter-spacing:0.04em;
    padding:0.18rem 0.5rem;border-radius:99px;background:#ece4d2;color:#5a4e38;border:1px solid #d9cdb2}
  #panel .badge.warn{background:#f0e6e0;color:#7a4a35;border-color:#dcc6b8}
  #panel .prose{font-size:0.95rem;line-height:1.7;color:#2f2c27}
  #panel .prose p+p{margin-top:0.6rem}
  #panel .altview{margin-top:0.85rem;padding:0.55rem 0.8rem;border-left:3px solid #7d8ea0;background:#eef1f4;
    font-size:0.86rem;line-height:1.6;color:#3f4a55}
  #panel .altview b{font-family:var(--font-ui);font-size:0.66rem;font-weight:700;letter-spacing:0.08em;
    text-transform:uppercase;color:#5f7286;display:block;margin-bottom:2px}
  #panel .refs{margin-top:0.9rem;display:flex;flex-wrap:wrap;gap:5px}
  #panel .refs a{font-family:var(--font-mono);font-size:0.68rem;color:#5a4e38;text-decoration:none;
    padding:0.16rem 0.45rem;border:1px solid #d9cdb2;border-radius:4px;background:#f1ecdf}
  #panel .refs a:hover{background:#e8dfc8}
  #panel .alsohere{margin-top:1rem;font-family:var(--font-ui);font-size:0.72rem;color:#8a8275}
  #panel .alsohere a{color:#5a4e38;cursor:pointer;text-decoration:underline dotted}
  #panel .alsohere a:hover{color:#2a2a2a}
  #panel .lettersline{margin-top:0.85rem;font-family:var(--font-ui);font-size:0.74rem;color:#5a4e38}

  /* ---------- timeline ---------- */
  #timeline{flex:none;background:#efe9db;border-top:1px solid #ddd5c4;padding:0.35rem 0.9rem 0.5rem;position:relative}
  #tl-controls{position:absolute;left:0.9rem;top:0.42rem;display:flex;gap:5px;z-index:2}
  #tl-controls button{width:28px;height:26px;border:1px solid #b3a88e;border-radius:5px;background:#f7f5f0;
    color:#3d3428;cursor:pointer;font-size:0.75rem;font-family:var(--font-ui)}
  #tl-controls button:hover{background:#ece4d2}
  #tlsvg{width:100%;height:96px;display:block}
  #tlsvg .band{opacity:0.3}
  #tlsvg .bandlbl{font-family:var(--font-ui);font-size:9.5px;font-weight:600;fill:#4a4437;letter-spacing:0.02em}
  #tlsvg .yearlbl{font-family:var(--font-mono);font-size:8.5px;fill:#8a8275}
  #tlsvg .ev{cursor:pointer}
  #tlsvg .ev .dia{fill:#f7f5f0;stroke-width:1.4;transition:transform 0.15s}
  #tlsvg .ev:hover .dia{transform:scale(1.5)}
  #tlsvg .ev.cur .dia{transform:scale(1.85)}
  #tlsvg .cursorline{stroke:#3d3428;stroke-width:1;stroke-dasharray:2 2}

  /* ---------- svg map layers ---------- */
  .prov{stroke:#8a7a5c;stroke-width:0.6;stroke-opacity:0.55;cursor:help}
  /* .prov fills are injected from PROV_FILL so the legend can never drift from the map */
  .prov:hover{filter:brightness(0.94)}
  .provlbl{font-family:var(--font-display);font-weight:600;fill:#7a6a48;letter-spacing:0.32em;pointer-events:none;text-anchor:middle}
  #coast{fill:none;stroke:#5d5240;stroke-width:0.8;pointer-events:none}
  .mborder{fill:none;stroke:#5f7286;stroke-width:1;stroke-dasharray:5 3;opacity:0.65;vector-effect:non-scaling-stroke}
  .mclbl{font-family:var(--font-ui);font-weight:600;fill:#5f7286;letter-spacing:0.22em;text-anchor:middle;opacity:0.8}
  .mcity rect{fill:#f7f5f0;stroke:#5f7286;stroke-width:1}
  .mcity text{font-family:var(--font-ui);font-size:8.5px;fill:#5f7286}
  .leg{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  .leg.future{opacity:0.13}
  .leg.dashed{stroke-dasharray:6 5}
  .leg.storm{stroke-dasharray:2 4;stroke-width:2.6}
  .pin{cursor:pointer}
  .pin circle.c{stroke:#43392b;stroke-width:1.3;fill:#f7f5f0}
  .pin.church circle.c{fill:#8a3a2b;stroke:#5c2317}
  .pin.lonly circle.c{fill:#f7f5f0;stroke:#2e5f7d;stroke-dasharray:2 1.5}
  .pin text{font-family:var(--font-body);font-size:10.5px;fill:#3d3428;paint-order:stroke;stroke:#ede4d0;stroke-width:2.6px;stroke-linejoin:round}
  .pin.dim{opacity:0.55}
  .pin:hover circle.c{stroke-width:2.2}
  #halo{fill:none;stroke:#b0642f;stroke-width:2;pointer-events:none;stroke-opacity:0}
  /* Animating stroke-width repaints the whole SVG every frame, and this used to
     run `infinite` — a permanent 60fps repaint of ~175 KB of coastline and
     border paths, which is most of why phones felt sluggish. Three pulses is
     enough of a "you are here"; the static ring below carries it after that. */
  #halo.on{animation:pulse 1.6s ease-out 3 forwards}
  @keyframes pulse{0%{stroke-opacity:0.9;stroke-width:2}100%{stroke-opacity:0;stroke-width:11}}
  .pin.cur circle.c{stroke:#b0642f;stroke-width:2.6}
  .anno text{font-family:var(--font-ui);font-style:italic;fill:#8a8275}
  .anno path,.anno line{stroke:#8a8275;fill:none}

  /* While the view is tweening, drop anti-aliasing on touch devices. The
     coastline and modern borders are ~175 KB of path data between them and
     re-rasterising that smoothly is what costs the frames. Desktop keeps
     its smooth edges — it can afford them. */
  @media (hover:none){
    #map.anim{shape-rendering:optimizeSpeed}
  }
  @media (prefers-reduced-motion:reduce){
    #halo.on{animation:none}
    #mapwrap{transition:none}
  }

  /* ---------- sheet bar: hidden until a small-screen layout turns it on,
     so the styling lives here rather than being repeated per breakpoint --- */
  #layers-btn{display:none}
  .sheetbar{display:none;flex:none;background:#f2ede1;border-bottom:1px solid #e0d8c6}
  .sheetbar .grab{padding:0.3rem 0 0.25rem;text-align:center;cursor:pointer;touch-action:none}
  .sheetbar .grab span{display:inline-block;width:42px;height:4px;border-radius:99px;background:#b9ae95}
  .sheetbar .snav{display:flex;align-items:center;justify-content:center;gap:0.4rem;
    padding:0 0.6rem 0.35rem}
  .sheetbar .snav button{flex:none;min-width:44px;height:36px;border:1px solid #b3a88e;
    border-radius:8px;background:#fbf9f4;color:#3d3428;font-size:0.88rem;
    font-family:var(--font-ui);cursor:pointer}
  .sheetbar .snav button:active{background:#e8dfc8}
  .sheetbar .scount{flex:1;text-align:center;font-family:var(--font-mono);
    font-size:0.72rem;color:#6b6358;white-space:nowrap}

  /* ---------- four layer checkboxes eat two rows of a narrow topbar, so
     below this width they collapse behind a button. Shared by the portrait
     and the sideways layouts. ---------- */
  @media (max-width:760px) and (min-height:521px),
         (max-height:520px) and (max-width:820px){
    .topbar{position:relative}
    #layers-btn{display:block;flex:none;font-family:var(--font-ui);font-size:0.72rem;
      background:#3f3f3f;color:#e8e3d8;border:1px solid #575757;border-radius:6px;
      padding:0.4rem 0.6rem;min-height:34px;cursor:pointer}
    .layers{display:none;position:absolute;top:100%;right:0.8rem;z-index:40;
      flex-direction:column;align-items:flex-start;gap:0;background:#2a2a2a;
      border:1px solid #4a4a4a;border-radius:8px;padding:0.35rem;
      box-shadow:0 6px 18px #0006;font-size:0.82rem}
    body.layers-open .layers{display:flex}
    .layers label{padding:0.55rem 0.6rem;width:100%}
  }

  /* ---------- tablet: stack, let the page scroll ---------- */
  @media (max-width:940px) and (min-width:761px) and (min-height:521px){
    body{overflow:auto}
    #main{flex-direction:column}
    #mapwrap{height:54vh;flex:none}
    #panel{width:100%;border-left:none;border-top:1px solid #ddd5c4;max-height:45vh}
    #timeline{overflow-x:auto}
    #tlsvg{min-width:900px}
    #tl-controls{position:sticky}
  }

  /* ---------- phone: map on top, event text in a bottom sheet ----------
     The sheet snaps between three heights and the map takes whatever is
     left, so the SVG always re-fits its box — no overlay maths, and the
     pin you just selected can never end up hidden behind the panel. */
  @media (max-width:760px) and (min-height:521px){
    html,body{height:100dvh}
    body{overflow:hidden}

    .topbar{padding:0.5rem 0.8rem;gap:0.5rem;flex-wrap:nowrap;position:relative}
    .topbar .crumbs{font-size:0.78rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .topbar .crumbs .title{font-size:0.92rem}
    #main{flex-direction:column;min-height:0}
    /* the sheet state drives the map height; the panel just takes the rest */
    #mapwrap{flex:none;height:30dvh;transition:height 0.25s ease}
    body.sheet-full #mapwrap{height:84px}
    #panel{width:100%;flex:1;min-height:0;border-left:none;border-top:1px solid #ddd5c4;
      max-height:none;box-shadow:0 -3px 14px #0000001f}
    /* peek: the panel shrinks to its header and the map takes all the slack,
       so there is never a band of dead paper above the timeline */
    body.sheet-peek #mapwrap{flex:1;height:auto}
    body.sheet-peek #panel{flex:none}
    body.sheet-peek #panel .pbody{display:none}
    /* the map is a vestigial strip when fully expanded — its controls would
       otherwise spill over the sheet bar */
    body.sheet-full #zoomctl{display:none}

    .sheetbar{display:block}

    /* touch targets and legibility */
    #zoomctl button{width:38px;height:38px;font-size:1.1rem}
    #yearbox .yr{font-size:1.4rem}
    #yearbox .ph{font-size:0.6rem}
    .pin text{font-size:12.5px}
    #panel .phead{padding:0.7rem 1rem 0.6rem}
    #panel h2{font-size:1.22rem}
    #panel .pbody{padding:0.85rem 1rem 1.4rem;-webkit-overflow-scrolling:touch}
    #panel .prose{font-size:1rem;line-height:1.68}
    #panel .refs a{font-size:0.76rem;padding:0.34rem 0.6rem}
    #panel .alsohere a{display:inline-block;padding:0.2rem 0}
    #legend{max-width:calc(100% - 24px);max-height:calc(100% - 22px);overflow:auto}
    body.sheet-full #legend,body.sheet-full #yearbox{display:none}

    /* the big timeline is unreadable at phone width — scroll it, shrink it,
       and drop its controls since the sheet bar already has them */
    #timeline{flex:none;overflow-x:auto;padding:0.3rem 0.6rem 0.4rem}
    #tlsvg{min-width:760px;height:74px}
    #tl-controls{display:none}
    /* the strip only earns its ~90px in the map-first state; once you are
       reading, that space goes to the text and the sheet bar navigates */
    body.sheet-half #timeline,body.sheet-full #timeline{display:none}
  }

  /* ---------- short and wide (a phone turned sideways) ----------
     Stacking wastes the width and leaves no room for either half, so go
     back to map-beside-text. There is no vertical budget for the timeline
     strip, so the sheet bar's arrows carry navigation instead. */
  @media (max-height:520px) and (max-width:1100px){
    html,body{height:100dvh}
    body{overflow:hidden}
    .topbar{padding:0.3rem 0.7rem;flex-wrap:nowrap}
    .topbar .crumbs{font-size:0.75rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .topbar .crumbs .title{font-size:0.88rem}
    .layers{font-size:0.68rem;gap:0.6rem}
    #main{flex-direction:row;min-height:0}
    #mapwrap{flex:1;height:auto;min-width:0}
    #panel{flex:none;width:min(340px,44%);max-height:none;
      border-left:1px solid #ddd5c4;border-top:none;box-shadow:none}
    #panel .pbody{display:block}
    #timeline{display:none}
    .sheetbar{display:block}
    .sheetbar .grab{display:none}       /* no sheet states in this layout */
    #zoomctl{top:8px;left:8px}
    #zoomctl button{width:32px;height:32px;font-size:0.95rem}
    #yearbox{top:8px;right:10px}
    #yearbox .yr{font-size:1.3rem}
    #legend{max-height:calc(100% - 18px);overflow:auto}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="crumbs">
    <span class="title">Paul of Tarsus</span><span>/</span>
    <span>A Life in Journeys</span>
  </div>
  <button id="layers-btn" aria-expanded="false" aria-controls="layers">Layers ▾</button>
  <div class="layers" id="layers">
    <label><input type="checkbox" id="ly-prov" checked> Roman provinces (c. AD 50)</label>
    <label><input type="checkbox" id="ly-mb" checked> Modern borders</label>
    <label><input type="checkbox" id="ly-mc" checked> Modern cities</label>
    <label><input type="checkbox" id="ly-all"> All routes bright</label>
  </div>
</div>

<div id="main">
  <div id="mapwrap">
    <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="yearbox"><div class="yr" id="yb-yr"></div><div class="ph" id="yb-ph"></div></div>
    <div id="zoomctl">
      <button id="z-in" title="Zoom in">+</button>
      <button id="z-out" title="Zoom out">−</button>
      <button id="z-reset" title="Reset view">⌂</button>
    </div>
    <details id="legend">
      <summary>Legend</summary>
      <div class="body" id="legendbody"></div>
    </details>
    <div id="ptip"></div>
  </div>

  <div id="panel">
    <div class="sheetbar">
      <div class="grab" id="s-grab" role="button" tabindex="0"
           aria-label="Expand or collapse the event panel"><span></span></div>
      <div class="snav">
        <button id="s-first" title="Start">⏮</button>
        <button id="s-prev" title="Previous event">◀</button>
        <span class="scount" id="s-count"></span>
        <button id="s-play" title="Play">▶</button>
        <button id="s-next" title="Next event">▶▏</button>
      </div>
    </div>
    <div class="phead">
      <span class="datechip" id="p-date"></span>
      <h2 id="p-title"></h2>
      <div class="placeline" id="p-place"></div>
      <div class="distline" id="p-dist"></div>
    </div>
    <div class="pbody">
      <div class="badges" id="p-badges"></div>
      <div class="prose" id="p-body"></div>
      <div id="p-alt"></div>
      <div id="p-letters"></div>
      <div class="refs" id="p-refs"></div>
      <div class="alsohere" id="p-also"></div>
    </div>
  </div>
</div>

<div id="timeline">
  <div id="tl-controls">
    <button id="btn-first" title="Start">⏮</button>
    <button id="btn-prev" title="Previous event (←)">◀</button>
    <button id="btn-play" title="Play">▶</button>
    <button id="btn-next" title="Next event (→)">▶▏</button>
  </div>
  <svg id="tlsvg" preserveAspectRatio="xMidYMid meet"></svg>

 "Back in Antioch with John Mark, the church worships and fasts — and the Spirit speaks. Hands are laid on Barnabas and Saul, and the first deliberate mission to the wider Roman world sails from Seleucia, Antioch's port.",
 ["Acts 12:25","Acts 13:1-3"],
 {leg:{pts:["jerusalem",[35.05,32.1],[35.05,32.55],[35.28,33.4],[35.7,34.9],[36.0,35.8],"antioch"]}}),
EV(2,47.2,"47","salamis","Cyprus: Salamis",
 "Barnabas's home island first. At Salamis they proclaim the word in the synagogues town by town — the pattern for every city after: to the Jew first — with John Mark assisting.",
 ["Acts 13:4-5"],
 {leg:{pts:["antioch",[35.9,36.05],[35.4,35.9],[34.7,35.5],"salamis"]}}),
EV(2,47.4,"47","paphos","The proconsul believes",
 "At the provincial capital, the magician Bar-Jesus (Elymas) opposes them before the proconsul Sergius Paulus; Saul pronounces temporary blindness on him, and the astonished proconsul believes. From this scene Luke switches names: “Saul, who was also called Paul.”",
 ["Acts 13:6-12"],
 {leg:{pts:["salamis",[33.4,35.1],[32.9,34.95],[32.55,34.85],"paphos"]}}),
EV(2,47.6,"47","perga","Pamphylia — Mark turns back",
 "They cross to the Pamphylian coast and go up to Perga, in the province of Lycia et Pamphylia that Claudius had assembled only four years earlier. Here John Mark leaves them and returns to Jerusalem — a departure Paul will not forget, and the fuse of the later split with Barnabas.",
 ["Acts 13:13","Acts 15:37-39"],
 {leg:{pts:["paphos",[31.9,35.4],[31.2,36.2],[30.9,36.75],"perga"]}}),
EV(2,47.8,"47","pisidian","Sermon at Pisidian Antioch",
 "Up the brigand-haunted Taurus roads to Pisidian Antioch. In the synagogue Paul preaches Israel's whole story funneled into Jesus, risen, bringing forgiveness “from everything from which you could not be freed by the law of Moses.” Next sabbath “almost the whole city” gathers; jealousy erupts; the missionaries announce: “we are turning to the Gentiles.” Expelled — leaving a church behind.",
 ["Acts 13:14-52"],
 {bg:["Church planted","Letter destination: Galatians"],
  leg:{pts:["perga",[30.8,37.3],[30.9,37.85],[31.05,38.1],"pisidian"]}}),
EV(2,48,"47/48","iconium","Iconium divided",
 "A long stay, bold speech, signs and wonders — and a city split down the middle. When a move is made to stone them, they flee across the regional border into Lycaonia.",
 ["Acts 14:1-7"],
 {bg:["Church planted"],leg:{pts:["pisidian",[31.7,38.15],[32.2,38.0],"iconium"]}}),
EV(2,48.15,"48","lystra","Zeus, Hermes — then stones",
 "Paul heals a man lame from birth, and the Lycaonian crowd erupts: “The gods have come down to us!” — Barnabas is Zeus, Paul is Hermes; the priest of Zeus brings oxen and garlands, and the two barely stop the sacrifice. Then agitators arrive from Antioch and Iconium, and the same crowd stones Paul and drags him out for dead. He gets up — and walks back into the city. Lystra is Timothy's hometown.",
 ["Acts 14:8-20","2 Timothy 3:11","2 Corinthians 11:25"],
 {bg:["Church planted"],leg:{pts:["iconium","lystra"]}}),
EV(2,48.3,"48","derbe","Derbe — and the brave road back",
 "Many disciples made at Derbe. Then, instead of slipping home the easy way through the Cilician Gates, they turn around and walk back through Lystra, Iconium and Antioch — the cities that beat and stoned them — strengthening the disciples and appointing elders: “through many tribulations we must enter the kingdom of God.”",
 ["Acts 14:20-23"],
 {bg:["Church planted"],leg:{pts:["lystra",[32.9,37.4],"derbe"]}}),
EV(2,48.5,"48","antioch","“A door of faith for the Gentiles”",
 "Down through Pisidia to Perga, a last sermon, then the port of Attalia and the sea home to Antioch. The church gathers to hear the report: God “had opened a door of faith to the Gentiles.” They stay “no little time.”",
 ["Acts 14:24-28"],
 {leg:{pts:["derbe",[33.0,37.47],[32.52,37.63],[32.55,37.93],[32.2,38.06],[31.7,38.22],[31.16,38.37],[30.97,38.05],[30.88,37.45],[30.9,37.02],"attalia",[31.3,36.35],[32.8,36.1],[34.3,36.25],[35.6,36.05],"antioch"]}}),
EV(2,48.65,"48","antioch","Showdown at Antioch",
 "Peter has been happily eating with Gentile believers — until “certain men from James” arrive, and he draws back; even Barnabas is swept along. Paul opposes Cephas “to his face, because he stood condemned”: the truth of the gospel is one table or none.",
 ["Galatians 2:11-14"],
 {}),
EV(2,48.8,"c. 48","antioch","✉ Galatians",
 "To the young churches of the first journey — Pisidian Antioch, Iconium, Lystra, Derbe — now “bewitched” by agitators demanding circumcision. One furious, tender letter: crucified with Messiah; justified by faith, not works of law; Abraham's single family; “neither Jew nor Greek… for you are all one in Christ Jesus.”",
 ["Galatians 1–6","Galatians 3:28"],
 {bg:["Letter written here: Galatians","Date debated"],
  alt:"Placing Galatians here, before the council, is the early-dating view. Others put it years later, during the second or third journey, and address it to churches in ethnic Galatia further north. On the early view it is the oldest surviving Christian document; on the later view 1 Thessalonians is."}),
EV(2,49,"48/49","jerusalem","The Jerusalem Council",
 "Men from Judea teach “unless you are circumcised you cannot be saved,” and after sharp dispute Paul, Barnabas and others go up to Jerusalem. Peter recalls Cornelius — “a yoke that neither our fathers nor we have been able to bear”; Barnabas and Paul report signs among the Gentiles; James rules: do not trouble them. A letter with light requirements secures the one table.",
 ["Acts 15:1-35"],
 {leg:{pts:["antioch",[35.95,35.75],[35.65,34.85],[35.42,33.6],[35.25,33.3],[35.0,32.55],[34.95,32.05],"jerusalem"]}}),
/* ---- Second journey ---- */
EV(3,49.5,"49","antioch","Paul and Barnabas part",
 "“Let us return and visit the brothers in every city.” Barnabas wants John Mark; Paul refuses — the “sharp disagreement” splits the old team. Barnabas sails for Cyprus with Mark; Paul chooses Silas and heads overland through Syria and Cilicia. (Years later: “Take Mark — he is very useful to me.”)",
 ["Acts 15:36-41","2 Timothy 4:11"],
 {leg:{pts:["jerusalem",[35.1,32.15],[35.1,32.6],[35.33,33.45],[35.75,34.95],[36.05,35.85],"antioch"]}}),
EV(3,49.7,"49","lystra","Timothy joins",
 "Through the Cilician Gates to the Galatian churches, delivering the council's letter. At Lystra: Timothy, son of a believing Jewish mother and a Greek father, well spoken of — Paul takes him, circumcising him for the sake of the mission now that the principle is secure. The churches “increased in numbers daily.”",
 ["Acts 16:1-5"],
 {leg:{pts:["antioch",[35.9,36.5],[35.35,36.8],"tarsus",[34.75,37.15],[34.6,37.42],[34.0,37.3],"derbe",[32.9,37.42],"lystra"]}}),
EV(3,49.9,"49/50","troas","Blocked twice — then the dream",
 "Forbidden by the Spirit to speak in Asia; opposite Mysia they try to enter Bithynia, “but the Spirit of Jesus did not allow them.” Funneled down to Troas on the Aegean shore, Paul dreams of a Macedonian pleading, “Come over to Macedonia and help us.” The narrative quietly shifts to “we” — Luke appears to join here.",
 ["Acts 16:6-10"],
 {leg:{pts:["lystra",[32.49,37.92],[31.25,38.35],[30.4,38.7],[29.5,39.0],[28.6,39.3],[27.6,39.6],[26.8,39.78],"troas"]}}),
EV(3,50,"50","philippi","Philippi: Lydia, a demon, a jailer",
 "A straight run past Samothrace to Neapolis, up the Via Egnatia to Philippi, a Roman colony. By the river, Lydia the purple-merchant believes — the first named convert on European soil. A fortune-telling slave girl is freed of her spirit; her owners' profits collapse; Paul and Silas are stripped, beaten with rods, and locked in the stocks. At midnight, hymns; then earthquake, open doors, and the jailer baptized with his whole house. In the morning Paul reveals his citizenship and makes the magistrates escort them out personally.",
 ["Acts 16:11-40","Philippians 1:3-8","1 Thessalonians 2:2"],
 {bg:["Church planted","Letter destination: Philippians"],
  leg:{pts:["troas",[25.9,40.1],[25.53,40.42],[24.9,40.75],[24.5,40.9],"neapolis","philippi"]}}),
EV(3,50.3,"50","thessalonica","“Turning the world upside down”",
 "Down the Via Egnatia through Amphipolis and Apollonia to the provincial capital. Three sabbaths of argument — “this Jesus… is the Messiah” — and a church forms, mostly Greeks. A mob storms Jason's house shouting that “these who have turned the world upside down… are acting against Caesar's decrees, saying there is another king, Jesus.” The brothers smuggle Paul and Silas out by night.",
 ["Acts 17:1-9","1 Thessalonians 1:9-10"],
 {bg:["Church planted","Letter destination: 1 & 2 Thessalonians"],
  leg:{pts:["philippi",[23.85,40.82],[23.45,40.65],[23.1,40.6],"thessalonica"]}}),
EV(3,50.5,"50","berea","The noble Bereans",
 "Berea receives the word “with all eagerness, examining the Scriptures daily to see if these things were so” — Luke's honorable mention. Then agitators arrive from Thessalonica and stir the crowds; Paul is escorted to the sea while Silas and Timothy stay behind.",
 ["Acts 17:10-15"],
 {bg:["Church planted"],leg:{pts:["thessalonica",[22.5,40.55],"berea"]}}),
EV(3,50.7,"50","athens","Areopagus",
 "Waiting alone in Athens, provoked by a forest of idols, Paul argues in synagogue and agora until Epicurean and Stoic philosophers haul “this babbler” before the Areopagus. The speech: the Unknown God named — maker of all, needing nothing, “in him we live and move and have our being” — and a day fixed for judgment by a man raised from the dead. At “resurrection” some mock; Dionysius the Areopagite and Damaris believe.",
 ["Acts 17:16-34"],
 {leg:{pts:["berea",[22.55,40.3],[22.65,39.9],[23.2,39.3],[23.8,38.7],[24.1,38.2],[23.95,37.9],"athens"]}}),
EV(3,51,"50–52","corinth","Eighteen months in Corinth",
 "Boomtown of two seas. Paul moves in with Aquila and Priscilla — tentmakers newly expelled from Rome under Claudius's edict (49) — working weekdays, arguing sabbaths. Crispus the synagogue ruler believes; a night vision steadies him: “Do not be afraid… I have many in this city who are my people.” Hauled before proconsul Gallio (in office 51/52 — the fixed anchor date of Pauline chronology), and the case is thrown out.",
 ["Acts 18:1-17","1 Corinthians 2:3"],
 {bg:["Church planted","Letter destination: 1 & 2 Corinthians"],
  leg:{pts:["athens",[23.4,37.95],[23.1,37.9],"corinth"]}}),
EV(3,51.3,"c. 50/51","corinth","✉ 1 & 2 Thessalonians",
 "Timothy returns from Thessalonica with good news of their faith, and Paul writes — thanksgiving, holiness, the dead in Christ rising first, the day coming “like a thief in the night.” A second letter soon follows, steadying a church rattled by end-times fever: stand firm; work quietly.",
 ["1 Thessalonians 3:6-8","1 Thessalonians 4:13-18","2 Thessalonians 2:1-2"],
 {bg:["Letters written here: 1 & 2 Thessalonians"]}),
EV(3,52,"52","antioch","Vow at Cenchreae; return via Ephesus",
 "At Corinth's eastern port Cenchreae Paul cuts his hair for a vow, sails with Priscilla and Aquila, and makes a first brief stop in Ephesus — “I will return to you if God wills,” leaving the couple there. Then Caesarea, up to greet the Jerusalem church, and home to Antioch.",
 ["Acts 18:18-22"],
 {leg:{pts:["corinth",[23.0,37.87],[23.6,37.7],[25.0,37.4],[26.5,37.7],"ephesus",[27.8,37.3],[28.9,36.5],[31.0,35.9],[33.0,34.6],[34.3,33.3],"caesarea",[35.05,32.05],"jerusalem",[35.08,32.2],[35.06,32.6],[35.3,33.5],[35.72,35.0],[36.02,35.9],"antioch"]}}),
/* ---- Third journey ---- */
EV(4,53.5,"53–56","ephesus","Three years in Ephesus",
 "Overland again through Galatia and Phrygia, then down the inland road to Ephesus — metropolis of Asia, temple of Artemis, one of the wonders of the world. Twelve disciples of John baptized; three months in the synagogue; then two years of daily lectures in the hall of Tyrannus until “all the residents of Asia heard the word.” Handkerchiefs heal; the sons of Sceva flee; magicians burn scrolls worth fifty thousand pieces of silver. From here Epaphras carries the gospel up the Lycus valley to Colossae and Laodicea.",
 ["Acts 18:23","Acts 19:1-20"],
 {bg:["Church planted — hub of Asia"],
  leg:{pts:["antioch",[35.9,36.5],[35.35,36.8],"tarsus",[34.7,37.2],[34.55,37.45],[33.8,37.8],[32.8,38.3],[31.8,38.6],[30.8,38.7],[29.8,38.55],[28.9,38.35],[28.2,38.1],"ephesus"]}}),
EV(4,54.5,"c. 54/55","ephesus","✉ 1 Corinthians",
 "Chloe's people arrive with reports, and a letter from Corinth with questions. Paul answers everything: factions (“Is Christ divided?”), the man with his father's wife, lawsuits, food offered to idols, the Lord's Supper abused, tongues and prophecy, the hymn to love, and the long thunder of chapter 15 on resurrection. “I will stay in Ephesus until Pentecost.”",
 ["1 Corinthians 1:11","1 Corinthians 13","1 Corinthians 15","1 Corinthians 16:8"],
 {bg:["Letter written here: 1 Corinthians"]}),
EV(4,55.5,"55/56","ephesus","Riot — and, likely, a prison",
 "Demetrius the silversmith rallies the shrine-makers — “Great is Artemis of the Ephesians!” — and the city packs the great theater, chanting for two hours. Around these months Paul speaks of having “fought wild beasts at Ephesus” and of an affliction in Asia so crushing “we despaired of life itself… we felt we had received the sentence of death.”",
 ["Acts 19:23-41","1 Corinthians 15:32","2 Corinthians 1:8-9"],
 {bg:["Imprisonment — reconstructed","Possible origin of the prison letters"],
  alt:"Acts records no imprisonment at Ephesus. The case for one is built from Paul's own hints — fighting “wild beasts” here, the affliction in Asia that made him despair of life — plus the short distances a letter like Philemon seems to assume. Many still assign Philippians, Philemon, Colossians and “Ephesians” to the Roman house arrest of 60–62 instead."}),
EV(4,56,"56","philippi","Titus in Macedonia — ✉ 2 Corinthians",
 "Out of Ephesus via Troas, where “a door was opened” but Paul's spirit can't rest — no Titus, no news of Corinth after the painful letter. Into Macedonia: “fighting without, fear within.” Then Titus arrives with word of Corinth's grief and repentance, and Paul writes 2 Corinthians — treasure in jars of clay, the ministry of reconciliation, strength perfected in weakness, and the great collection for Jerusalem.",
 ["Acts 20:1","2 Corinthians 2:12-13","2 Corinthians 7:5-16","2 Corinthians 4:7"],
 {bg:["Letter written here: 2 Corinthians"],
  leg:{pts:["ephesus",[26.9,38.5],[26.5,39.1],[26.2,39.5],"troas",[25.6,40.3],[24.7,40.8],"neapolis","philippi"]}}),
EV(4,56.4,"c. 56","illyricum","“…as far as Illyricum”",
 "Romans claims the gospel has been preached “from Jerusalem and all the way around to Illyricum” — perhaps these Macedonian months carried Paul west up the Via Egnatia toward the Adriatic. Nothing more is recorded; the line is a window onto how much Acts leaves out.",
 ["Romans 15:19"],
 {bg:["Route conjectural"],
  leg:{c:"dashed",pts:["philippi",[23.9,40.9],[23.1,40.65],"thessalonica",[22.3,40.85],[21.5,41.05],[20.6,41.1],[19.9,41.2],"illyricum"]}}),
EV(4,56.9,"winter 56/57","corinth","Winter in Corinth — ✉ Romans",
 "Three months in Greece, hosted by Gaius. To prepare his way west, Paul dictates to Tertius the fullest statement of his gospel: God's righteousness unveiled apart from law; Adam and Messiah; baptism into death and life; the Spirit and the groaning creation; Israel's anguish and the olive tree; “present your bodies”; the strong and the weak at one table. Plans laid out plainly: Jerusalem with the collection, then Rome — then Spain. Phoebe, deacon of the church at Cenchreae, carries the letter.",
 ["Romans 1:16-17","Romans 15:22-29","Romans 16:1-2","Acts 20:2-3"],
 {bg:["Letter written here: Romans"],
  leg:{pts:["thessalonica",[22.5,39.9],[22.4,39.3],[22.6,38.8],[22.75,38.35],[23.0,38.05],"corinth"]}}),
EV(4,57,"spring 57","troas","Passover at Philippi; Eutychus at Troas",
 "About to sail for Syria, Paul learns of a plot and doubles back overland through Macedonia. Passover kept at Philippi (Luke rejoins — “we”); five days' sail to Troas; on the first day of the week, bread broken upstairs, lamps burning, Paul talking past midnight — and young Eutychus sinks into sleep, falls from the third story, and is taken up dead. Paul embraces him: “his life is in him.” They leave comforted, at daybreak, mid-sentence resumed.",
 ["Acts 20:3-12"],
 {leg:{pts:["corinth",[23.1,38.1],[22.8,38.7],[22.5,39.4],[22.6,40.1],[23.2,40.6],[23.9,40.95],"philippi","neapolis",[25.1,40.6],[25.8,40.2],"troas"]}}),
EV(4,57.1,"57","miletus","Farewell on the beach",
 "Paul walks the twenty miles to Assos alone while the ship rounds the cape, then island-hops — Mitylene, Chios, Samos — to Miletus, bypassing Ephesus to save time. The Ephesian elders come down, and he gives the only Acts speech addressed to Christians: “I did not shrink from declaring to you the whole counsel of God… the Holy Spirit testifies that imprisonment and afflictions await me.” Much weeping; they embrace him, “sorrowful most of all because he said they would not see his face again,” and walk him to the ship.",
 ["Acts 20:13-38"],
 {leg:{pts:["troas",[26.3,39.6],"assos",[26.6,39.05],[26.4,38.5],[26.75,38.0],[26.98,37.75],"miletus"]}}),
EV(4,57.25,"57","caesarea","Warnings up the coast",
 "Cos, Rhodes, Patara; a ship for Phoenicia, Cyprus sinking to port. Seven days at Tyre, where disciples “through the Spirit” urge him not to go — and the whole church, wives and children, kneels on the beach to pray. At Caesarea, in Philip the evangelist's house, Agabus binds his own hands and feet with Paul's belt: “So shall the Jews at Jerusalem bind the man who owns this belt.” Weeping all around. “I am ready not only to be imprisoned but to die… The will of the Lord be done.”",
 ["Acts 21:1-14"],
 {leg:{pts:["miletus",[27.3,36.9],[27.9,36.5],[28.6,36.3],[29.31,36.22],[30.5,35.7],[32.0,34.9],[33.5,34.0],[34.6,33.4],"tyre",[35.07,32.92],"caesarea"]}}),
/* ---- Arrest & Caesarea ---- */
EV(5,57.4,"Pentecost 57","jerusalem","Seized in the Temple",
 "James receives him warmly; the collection is delivered. Then Jews from Asia see him in the Temple and scream that he has brought Trophimus the Ephesian past the barrier. Dragged out and beaten, he is rescued — by arrest — when tribune Claudius Lysias wades in with soldiers. From the steps of the Antonia, in Hebrew: “Brothers and fathers…” The crowd listens until the word “Gentiles,” then howls. Before the Sanhedrin he splits the room on resurrection. That night the Lord stands by him: “Take courage — as you have testified in Jerusalem, so you must testify also in Rome.”",
 ["Acts 21:15–23:11"],
 {leg:{pts:["caesarea",[35.0,32.2],"jerusalem"]}}),
EV(5,58,"57–59","caesarea","Two years, three hearings",
 "Forty men vow neither to eat nor drink until Paul is dead; his sister's son overhears; 470 soldiers ride him by night via Antipatris to Caesarea. Governor Felix (with Drusilla) hears him gladly — and trembles at “righteousness, self-control, and the coming judgment” — but wants a bribe, and leaves him bound two years. Festus arrives; Paul cuts the knot: “I appeal to Caesar.” Before Agrippa II and Bernice he tells the Damascus story once more — “Would you become such as I am, except for these chains?” Verdict in absentia: “This man could have been set free.”",
 ["Acts 23:12–26:32"],
 {bg:["Imprisonment"],
  leg:{pts:["jerusalem",[35.05,31.95],[34.97,32.1],[34.95,32.35],"caesarea"]}}),
/* ---- Voyage to Rome ---- */
EV(6,59.4,"59","myra","To sea — Sidon, the lee of Cyprus, Myra",
 "Handed to Julius, a centurion of the Augustan Cohort, with Luke and Aristarchus along. At Sidon, Julius kindly lets him visit friends. Contrary winds push them under the lee of Cyprus and along the Cilician coast to Myra in Lycia, where the centurion finds an Alexandrian grain ship bound for Italy — huge, heavy, and late in the season.",
 ["Acts 27:1-6"],
 {leg:{pts:["caesarea",[34.7,32.9],"sidon",[35.1,34.2],[34.9,35.2],[34.3,35.75],[33.0,36.0],[31.8,36.1],[30.6,36.1],"myra"]}}),
EV(6,59.6,"Oct 59","fairhavens","Fair Havens: the warning",
 "Days of slow beating to windward off Cnidus, then under Crete's lee past Salmone to a bay called Fair Havens. The Fast (Yom Kippur) is already past — sailing season closing. Paul: “Sirs, I perceive this voyage will be with injury and much loss.” But the harbor is poor for wintering, and the centurion trusts pilot and owner; when a gentle south wind springs up, they run for Phoenix.",
 ["Acts 27:7-13"],
 {leg:{pts:["myra",[29.2,36.15],[28.2,36.3],[27.6,36.55],[27.37,36.66],[26.8,36.2],[26.35,35.35],[25.8,35.0],[25.2,34.85],"fairhavens"]}}),
EV(6,59.75,"59","malta","Euraquilo — fourteen nights — shipwreck",
 "The northeaster strikes off the mountains — Euraquilo. Under little Cauda they fight the boat aboard and undergird the hull with cables; next day cargo goes over, then the tackle; “neither sun nor stars for many days… all hope of being saved was at last abandoned.” Paul stands amid the despair: an angel of God stood by me — “Do not be afraid; you must stand before Caesar, and God has granted you all who sail with you.” Fourteenth night, soundings shoaling, four anchors from the stern; at dawn he makes 276 exhausted souls eat. The ship runs aground on a reef off Malta and breaks up in the surf — every life saved. On the beach, a viper fastens on Paul's hand; he shakes it into the fire. Publius's father healed; three months of Maltese winter and honor.",
 ["Acts 27:14–28:10"],
 {bg:["Shipwreck"],
  leg:{c:"storm",pts:["fairhavens",[24.4,34.95],[24.0,34.8],[23.6,34.75],[22.8,34.9],[21.5,35.2],[20.0,35.5],[18.5,35.6],[17.0,35.75],[15.8,35.85],[14.75,35.9],"malta"]}}),
EV(6,60,"spring 60","rome","Puteoli and the Appian Way",
 "Another Alexandrian ship — figurehead the Twin Gods — three days at Syracuse, a day at Rhegium, then a fair south wind to Puteoli on the Bay of Naples: “there we found brothers,” seven days welcome. Then the Via Appia. Believers walk out from Rome forty miles to the Forum of Appius and thirty to Three Taverns to meet the prisoner. “On seeing them, Paul thanked God and took courage.”",
 ["Acts 28:11-15"],
 {leg:{pts:["malta",[14.7,36.3],[15.1,36.7],"syracuse",[15.4,37.5],"rhegium",[15.5,38.6],[15.0,39.6],[14.4,40.4],"puteoli",[13.9,41.15],[13.35,41.35],[12.9,41.6],"rome"]}}),
/* ---- Rome & after ---- */
EV(7,61,"60–62","rome","Two whole years — unhindered",
 "House arrest in his own rented lodging, one soldier, one chain. The local Jewish leaders come; morning to evening he reasons “about Jesus from the Law of Moses and the Prophets.” Acts closes mid-stride: two whole years “welcoming all who came to him, proclaiming the kingdom of God and teaching about the Lord Jesus Christ with all boldness and without hindrance.”",
 ["Acts 28:16-31"],
 {bg:["Imprisonment","Letter destination: Romans (written 56/57)"],
  alt:"On the traditional view it is these two years, not an earlier stretch in Ephesus, that produced the four prison letters — Philippians, Philemon, Colossians and “Ephesians.”"}),
EV(7,64,"62–66?","rome","After Acts: hints and silence",
 "Was he released? The pastoral letters sketch journeys Acts never tells: Crete with Titus (“put what remained in order”), a winter planned at Nicopolis, the cloak and parchments left at Troas, Trophimus ill at Miletus, Erastus at Corinth. Romans had promised Spain; 1 Clement (c. 96) says Paul reached “the limits of the West.” None of it is certain — the record simply fades.",
 ["Titus 1:5","Titus 3:12","2 Timothy 4:13","2 Timothy 4:20","Romans 15:24"],
 {bg:["Traditions — uncertain"],
  leg:{c:"dashed",pts:["rome",[13.5,40.8],[15.5,38.8],[17.5,37.0],[20.0,35.8],[22.5,35.2],"fairhavens",[26.8,35.9],"miletus",[26.5,38.8],"troas",[24.5,39.5],[22.0,39.2],"nicopolis",[19.5,40.0],[17.5,40.8],[15.5,41.3],[13.8,41.6],"rome"]}}),
EV(7,66,"c. 64–67","rome","The last mile",
 "Seized in the terror after the Great Fire (64), or a year or two later. 2 Timothy speaks from a Roman cell in winter: deserted by many, “the Lord stood by me”; “the time of my departure has come. I have fought the good fight, I have finished the race, I have kept the faith.” Tradition says the citizen died by the sword on the Ostian Way; the basilica of St Paul Outside the Walls rises over the grave.",
 ["2 Timothy 4:6-8","2 Timothy 4:16-18"],
 {bg:["Martyrdom, under Nero"]}),
];

const svg = document.getElementById("map");
const NS = "http://www.w3.org/2000/svg";
const W = GEO.W, H = GEO.H;
const CORE = GEO.CORE;      // default framing: Paul's Mediterranean world
const REF = CORE.w;         // reference width for marker/label scaling (1 at default zoom)
svg.setAttribute("viewBox", `${CORE.x} ${CORE.y} ${CORE.w} ${CORE.h}`);
function el(name, attrs, parent){
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function proj(lon, lat){ return [(lon-GEO.LON0)*GEO.K*GEO.COSM, (GEO.LAT1-lat)*GEO.K]; }
function pt(x){ return Array.isArray(x) ? proj(x[0], x[1]) : proj(PLACES[x][2], PLACES[x][3]); }

/* base layers */
el("rect", {x:-2000, y:-2000, width:W+4000, height:H+4000, fill:"#c8d6d8"}, svg);
const defs = el("defs", {}, svg);
const clip = el("clipPath", {id:"landclip"}, defs);
el("path", {d:GEO.land}, clip);
const fSh = el("filter", {id:"coastglow", x:"-5%", y:"-5%", width:"110%", height:"110%"}, defs);
el("feDropShadow", {dx:0, dy:0, stdDeviation:2.2, "flood-color":"#5b7078", "flood-opacity":0.55}, fSh);

/* Soft edges. Two things in this map are lon/lat rectangles rather than real
   geography: the baked Natural Earth extent (-14°..62°, 12°..59°) and the
   province polygons, which stop dead at 10.2°..37.5°, 29.6°..43.4°. Left alone
   both read as hard squares. Each mask below is just a white rectangle pushed
   through a Gaussian blur, so the layer dissolves into its surroundings instead
   of being guillotined. */
function fadeMask(id, x, y, w, h, sd){
  const f = el("filter", {id:id+"-blur", x:"-30%", y:"-30%", width:"160%", height:"160%"}, defs);
  el("feGaussianBlur", {stdDeviation:sd}, f);
  const m = el("mask", {id, maskUnits:"userSpaceOnUse",
    x:x-sd*6, y:y-sd*6, width:w+sd*12, height:h+sd*12}, defs);
  el("rect", {x, y, width:w, height:h, fill:"#fff", filter:`url(#${id}-blur)`}, m);
}
fadeMask("worldfade", 0, 0, W, H, 40);

/* Everything geographic lives inside gWorld and fades at the data edge.
   Routes, annotations and pins are appended to the svg afterwards, so they
   stay above it and never fade. */
const gWorld = el("g", {id:"gworld", mask:"url(#worldfade)"}, svg);
el("path", {d:GEO.land, fill:"#ece3cd", filter:"url(#coastglow)"}, gWorld);

/* Tints pulled ~18% toward the land colour so the province box reads as a wash
   over the map rather than a separate slab pasted on top of it. */
const PROV_FILL = {it:"#e1c88d", sen:"#e8ddb4", imp:"#e4cdb4", cli:"#d2d5ab"};
{ const s = document.createElement("style");
  s.textContent = Object.entries(PROV_FILL).map(([k,v]) => `.prov.${k}{fill:${v}}`).join("");
  document.head.appendChild(s); }

const gProv = el("g", {id:"gprov", "clip-path":"url(#landclip)"}, gWorld);
const STATUS_NAMES = {it:"Italia — Roman heartland", sen:"Senatorial province", imp:"Imperial province", cli:"Client kingdom"};
for (const p of GEO.provinces){
  const path = el("path", {d:p.d, class:"prov "+p.status}, gProv);
  path.dataset.name = p.name; path.dataset.status = p.status; path.dataset.note = p.note;
}
/* feather the province box too — measured from the polygons themselves, so it
   follows the data if the provinces are ever redrawn */
{ const pb = gProv.getBBox();
  fadeMask("provfade", pb.x, pb.y, pb.width, pb.height, 42);
  gProv.setAttribute("mask", "url(#provfade)"); }
el("path", {d:GEO.land, id:"coast"}, gWorld);

const gProvLbl = el("g", {id:"gprovlbl", "pointer-events":"none"}, gWorld);
const provLblNodes = [];
for (const p of GEO.provinces){
  for (const l of p.labels){
    const t = el("text", {class:"provlbl", "font-size":l.size}, gProvLbl);
    t.textContent = l.text || p.name;
    provLblNodes.push({n:t, x:l.x, y:l.y, angle:l.angle});
  }
}

const gMB = el("g", {id:"gmb"}, gWorld);
el("path", {d:GEO.borders, class:"mborder"}, gMB);
const mcLblNodes = [];
for (const c of MODERN_COUNTRIES){
  const [x,y] = proj(c[1], c[2]);
  const t = el("text", {class:"mclbl", "font-size":c[3]}, gMB);
  t.textContent = c[0];
  mcLblNodes.push({n:t, x, y});
}

const gMC = el("g", {id:"gmc"}, gWorld);
const mcityNodes = [];
for (const c of MODERN_CITIES){
  const [x,y] = proj(c[1], c[2]);
  const g = el("g", {class:"mcity"}, gMC);
  el("rect", {x:-2.6, y:-2.6, width:5.2, height:5.2, transform:"rotate(45)"}, g);
  const t = el("text", {x:c[3] !== undefined ? c[3] : 5, y:c[4] !== undefined ? c[4] : 3,
    "text-anchor":c[5] || "start"}, g);
  t.textContent = c[0];
  mcityNodes.push({n:g, x, y});
}

/* routes */
function smoothPath(pts){
  if (pts.length < 3) return "M" + pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L");
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i=0; i<pts.length-1; i++){
    const p0 = pts[Math.max(0,i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1,i+2)];
    const c1 = [p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2 = [p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)},${c2[0].toFixed(1)} ${c2[1].toFixed(1)},${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
const gLegs = el("g", {id:"glegs"}, svg);
let cur = -1, playTimer = null, allBright = false;
const legNodes = [];   // index-aligned with EVENTS (null when no leg)
EVENTS.forEach((e, i) => {
  if (!e.leg){ legNodes.push(null); return; }
  const pts = e.leg.pts.map(pt);
  const cls = "leg" + (e.leg.c ? " "+e.leg.c : "");
  const n = el("path", {d:smoothPath(pts), class:cls, stroke:PHASES[e.ph].color, "stroke-width":2.2}, gLegs);
  legNodes.push(n);
});

/* annotations */
const gAnno = el("g", {class:"anno"}, svg);
{
  const [bx,by] = proj(29.45, 40.3);
  const t = el("text", {x:bx, y:by, "font-size":8.5, "text-anchor":"middle"}, gAnno);
  t.textContent = "✕ Bithynia — “the Spirit did not allow” (Acts 16:7)";
  const [sx,sy] = proj(11.6, 41.62);
  const [ex,ey] = proj(10.32, 41.9);
  el("path", {d:`M${sx} ${sy}L${ex} ${ey}M${ex+4} ${ey-3}L${ex} ${ey}L${ex+4.5} ${ey+2.5}`, "stroke-dasharray":"4 3", "stroke-width":1}, gAnno);
  const t2 = el("text", {x:sx+3, y:sy+3, "font-size":8.5}, gAnno);
  t2.textContent = "to Spain? (Rom 15:24)";
}

/* place markers */
const gPins = el("g", {id:"gpins"}, svg);
const pinNodes = {};
const placeEvents = {};
EVENTS.forEach((e,i)=>{ (placeEvents[e.p] = placeEvents[e.p] || []).push(i); });
for (const id in PLACES){
  const P = PLACES[id];
  const [x,y] = proj(P[2], P[3]);
  const g = el("g", {class:"pin" + (P[5].ch ? " church" : "") + (P[5].lo ? " lonly" : "")}, gPins);
  const r = P[4] === 2 ? 5 : P[4] === 1 ? 4 : 2.7;
  el("circle", {class:"c", r}, g);
  el("circle", {r:r+6, fill:"transparent", stroke:"none"}, g);  // fat hit target
  const t = el("text", {x:P[6], y:P[7], "text-anchor":P[8], "font-size":P[4]===2?11:P[4]===1?10:8.5}, g);
  if (P[4] === 2) t.setAttribute("font-weight","600");
  t.textContent = P[0] + (P[5].lt ? " ✉" : "");
  g.addEventListener("click", ev => { ev.stopPropagation(); selectPlace(id); });
  pinNodes[id] = {n:g, x, y};
}
const halo = el("circle", {id:"halo", r:8}, svg);

/* province tooltip */
const ptip = document.getElementById("ptip");
gProv.addEventListener("pointermove", ev => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.name){ ptip.style.display="none"; return; }
  ptip.innerHTML = `<div class="nm">${t.dataset.name}</div><div class="st">${STATUS_NAMES[t.dataset.status]}</div><div>${t.dataset.note}</div>`;
  const wr = document.getElementById("mapwrap").getBoundingClientRect();
  ptip.style.display = "block";
  ptip.style.left = Math.min(ev.clientX - wr.left + 14, wr.width - 275) + "px";
  ptip.style.top = Math.min(ev.clientY - wr.top + 10, wr.height - 120) + "px";
});
gProv.addEventListener("pointerleave", () => ptip.style.display = "none");

/* ============================ PAN / ZOOM ============================ */
/* Wheel, trackpad pinch, two-finger pinch, drag, double-click, buttons and
   keys. Zoom is bounded at both ends and the view centre is kept over the
   data, so the map can never be flung off into empty sea. */
const MIN_W = REF/10, MAX_W = W*1.02;
let vb = {x:CORE.x, y:CORE.y, w:CORE.w, h:CORE.h};
let animRAF = null;

function clampVB(v){
  v.w = Math.min(Math.max(v.w, MIN_W), MAX_W);
  v.h = v.w * H / W;
  const cx = v.x + v.w/2, cy = v.y + v.h/2;
  const px = Math.min(Math.max(cx, -0.08*W), 1.08*W);
  const py = Math.min(Math.max(cy, -0.08*H), 1.08*H);
  v.x += px - cx; v.y += py - cy;
  return v;
}
let lastK = null;
function applyVB(){
  clampVB(vb);
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k = REF / vb.w;
  /* Everything below depends only on the zoom level, not on where the view is
     centred. A pan (stepping between events, dragging) leaves k untouched, so
     skipping this saves ~90 setAttribute calls and a layer-opacity write on
     every frame of the tween — the difference between smooth and not on a
     phone. Zooming still pays the full price, as it must. */
  if (k !== lastK){
    lastK = k;
    const sPin = 1 / k, sProv = Math.pow(k, -0.55), sMC = Math.pow(k, -0.8);
    for (const id in pinNodes){
      const p = pinNodes[id];
      p.n.setAttribute("transform", `translate(${p.x} ${p.y}) scale(${sPin})`);
    }
    for (const l of provLblNodes)
      l.n.setAttribute("transform", `translate(${l.x} ${l.y}) rotate(${l.angle}) scale(${sProv})`);
    for (const l of mcLblNodes)
      l.n.setAttribute("transform", `translate(${l.x} ${l.y}) scale(${sMC})`);
    for (const c of mcityNodes)
      c.n.setAttribute("transform", `translate(${c.x} ${c.y}) scale(${sPin})`);
    gAnno.setAttribute("transform", "");  // annotations scale with map
    /* Roman provinces are a rectangle of baked data. Feathering hides the seam at
       working zoom, but pulled right back the whole tinted box would read as a
       square floating over Europe and Africa — so retire the layer once the view
       is wider than the Roman world it describes. */
    const pf = 1 - (vb.w - CORE.w*1.30) / (CORE.w*2.05 - CORE.w*1.30);
    gProv.style.opacity = gProvLbl.style.opacity = Math.min(1, Math.max(0, pf));
    positionHalo();
  }
}
function svgPoint(clientX, clientY){
  const r = svg.getBoundingClientRect();
  const scale = Math.min(r.width / vb.w, r.height / vb.h);
  const ox = (r.width - vb.w * scale) / 2, oy = (r.height - vb.h * scale) / 2;
  return [vb.x + (clientX - r.left - ox) / scale, vb.y + (clientY - r.top - oy) / scale];
}
/* eased tween between two viewBoxes */
const REDUCED = window.matchMedia("(prefers-reduced-motion:reduce)");
function animateTo(target, ms){
  cancelAnimationFrame(animRAF);
  clampVB(target);
  if (REDUCED.matches){ vb = {...target}; applyVB(); return; }
  const from = {...vb}, t0 = performance.now();
  svg.classList.add("anim");
  (function step(t){
    const k = Math.min(1, (t - t0) / ms);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    vb.x = from.x + (target.x-from.x)*e;  vb.y = from.y + (target.y-from.y)*e;
    vb.w = from.w + (target.w-from.w)*e;  vb.h = from.h + (target.h-from.h)*e;
    applyVB();
    if (k < 1) animRAF = requestAnimationFrame(step);
    else svg.classList.remove("anim");
  })(t0);
}
function zoomAt(cx, cy, f, ms){
  const nw = Math.min(Math.max(vb.w / f, MIN_W), MAX_W);
  const k = nw / vb.w;
  const t = {x: cx - (cx-vb.x)*k, y: cy - (cy-vb.y)*k, w: nw, h: nw*H/W};
  if (ms) animateTo(t, ms);
  else { vb = t; applyVB(); }
}
/* pan — never zoom — just far enough to bring a pin comfortably on screen */
function ensureVisible(p){
  const m = Math.min(vb.w, vb.h) * 0.16;
  let nx = vb.x, ny = vb.y;
  if (p.x < vb.x + m)             nx = p.x - m;
  else if (p.x > vb.x + vb.w - m) nx = p.x - vb.w + m;
  if (p.y < vb.y + m)             ny = p.y - m;
  else if (p.y > vb.y + vb.h - m) ny = p.y - vb.h + m;
  if (nx !== vb.x || ny !== vb.y) animateTo({x:nx, y:ny, w:vb.w, h:vb.h}, 420);
}

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  cancelAnimationFrame(animRAF);
  const [mx,my] = svgPoint(ev.clientX, ev.clientY);
  let d = ev.deltaY;
  if (ev.deltaMode === 1) d *= 16; else if (ev.deltaMode === 2) d *= 400;
  /* ctrlKey means a trackpad pinch rather than a wheel notch — much finer */
  const f = Math.exp(-d * (ev.ctrlKey ? 0.010 : 0.0024));
  zoomAt(mx, my, Math.min(Math.max(f, 0.25), 4));
}, {passive:false});

/* pointers tracked in a map so two-finger pinch works alongside single drag */
const ptrs = new Map();
let drag = null, pinch = null;
svg.addEventListener("pointerdown", ev => {
  svg.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  cancelAnimationFrame(animRAF);
  if (ptrs.size === 2){
    drag = null;
    svg.classList.remove("dragging");
    const [a,b] = [...ptrs.values()];
    pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), vb:{...vb},
             c:svgPoint((a.x+b.x)/2, (a.y+b.y)/2)};
  } else if (ptrs.size === 1){
    drag = {x:ev.clientX, y:ev.clientY, vx:vb.x, vy:vb.y, moved:false};
    svg.classList.add("dragging");
  }
});
svg.addEventListener("pointermove", ev => {
  if (!ptrs.has(ev.pointerId)) return;
  ptrs.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pinch && ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    const nd = Math.hypot(a.x-b.x, a.y-b.y);
    if (nd > 8){
      const nw = Math.min(Math.max(pinch.vb.w * (pinch.d/nd), MIN_W), MAX_W);
      const k = nw / pinch.vb.w;
      vb = {x: pinch.c[0] - (pinch.c[0]-pinch.vb.x)*k,
            y: pinch.c[1] - (pinch.c[1]-pinch.vb.y)*k, w:nw, h:nw*H/W};
      applyVB();
    }
    return;
  }
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  const scale = Math.min(r.width / vb.w, r.height / vb.h);
  if (Math.abs(ev.clientX-drag.x) + Math.abs(ev.clientY-drag.y) > 4) drag.moved = true;
  vb.x = drag.vx - (ev.clientX - drag.x) / scale;
  vb.y = drag.vy - (ev.clientY - drag.y) / scale;
  applyVB();
});
function endPtr(ev){
  ptrs.delete(ev.pointerId);
  try { svg.releasePointerCapture(ev.pointerId); } catch(e){}
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0){ drag = null; svg.classList.remove("dragging"); }
}
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("dblclick", ev => {
  ev.preventDefault();
  const [mx,my] = svgPoint(ev.clientX, ev.clientY);
  zoomAt(mx, my, ev.shiftKey ? 1/1.9 : 1.9, 260);
});

const resetVB = () => animateTo({x:CORE.x, y:CORE.y, w:CORE.w, h:CORE.h}, 340);
document.getElementById("z-in").onclick  = () => zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1.5, 220);
document.getElementById("z-out").onclick = () => zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1/1.5, 220);
document.getElementById("z-reset").onclick = resetVB;

}

bindToggle("ly-mc", on => gMC.style.display = on?"":"none");

/* ============================ DISTANCE TRAVELED ============================ */
/* Great-circle miles along each event's drawn route (leg.pts), split into
   overland vs. sea legs by testing segment midpoints against the coastline,
   with a running total that begins at the Damascus Road experience. */
const MI_R = 3958.8;                       // earth radius, miles
const coastPath = document.getElementById("coast");
const _sp = svg.createSVGPoint();
function haversineMi(a, b){
  const toR = Math.PI/180, dLat = (b[1]-a[1])*toR, dLon = (b[0]-a[0])*toR;
  const s = Math.sin(dLat/2)**2 + Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dLon/2)**2;
  return 2*MI_R*Math.asin(Math.min(1, Math.sqrt(s)));
}
function lonlat(x){ return Array.isArray(x) ? [x[0], x[1]] : [PLACES[x][2], PLACES[x][3]]; }
function isSea(lon, lat){
  const [x,y] = proj(lon, lat); _sp.x = x; _sp.y = y;
  try { return !coastPath.isPointInFill(_sp); } catch(e){ return false; }
}
/* returns {mi, mode} for an event's leg; mi=0 / mode="" when it stayed put */
function legTravel(e){
  if (!e.leg) return {mi:0, land:0, sea:0, mode:""};
  let mi = 0, land = 0, sea = 0, prev = null;
  for (const p of e.leg.pts){
    const c = lonlat(p);
    if (prev){
      const d = haversineMi(prev, c);
      mi += d;
      const mid = [(prev[0]+c[0])/2, (prev[1]+c[1])/2];
      if (isSea(mid[0], mid[1])) sea += d; else land += d;
    }
    prev = c;
  }
  const tot = land + sea, sf = tot ? sea/tot : 0;
  const mode = tot ? (sf > 0.65 ? "by sea" : sf < 0.2 ? "on foot" : "on foot & sea") : "";
  return {mi, land, sea, mode};
}
const DAMASCUS_I = EVENTS.findIndex(e => e.t === "The Damascus Road");
const LEG_MI = EVENTS.map(legTravel);
/* running total from the Damascus Road onward: 0 AT Damascus, accumulating only
   the journeys that follow, tracked separately for overland vs. sea travel */
const CUM = [];   // {tot, land, sea} for Damascus-and-after, else null
{ let land = 0, sea = 0;
  EVENTS.forEach((e,i) => {
    if (i > DAMASCUS_I){ land += LEG_MI[i].land; sea += LEG_MI[i].sea; }
    CUM.push(i >= DAMASCUS_I ? {tot: land+sea, land, sea} : null);
  });
}
const miFmt = n => Math.round(n).toLocaleString();

/* ============================ SELECT / PANEL ============================ */
const gw = s => `https://www.biblegateway.com/passage/?search=${encodeURIComponent(s)}&version=ESV`;

function refreshLegs(){
  legNodes.forEach((n,i) => {
    if (!n) return;
    n.classList.toggle("future", !allBright && i > cur);
  });
}
function positionHalo(){
  if (cur < 0) return;
  const p = pinNodes[EVENTS[cur].p];
  const k = REF / vb.w;
  halo.setAttribute("cx", p.x); halo.setAttribute("cy", p.y);
  halo.setAttribute("transform", `translate(${p.x} ${p.y}) scale(${1/k}) translate(${-p.x} ${-p.y})`);
}
function select(i, keepView){
  if (i < 0 || i >= EVENTS.length) return;
  cur = i;
  const e = EVENTS[i], P = PLACES[e.p], ph = PHASES[e.ph];
  /* panel */
  document.getElementById("p-date").textContent = e.d;
  document.getElementById("p-date").style.background = ph.color;
  document.getElementById("p-title").textContent = e.t;
  document.getElementById("p-place").innerHTML =
    `<b>${P[0]}</b> · ${ph.name} &nbsp;—&nbsp; today: ${P[1]}`;
  /* distance traveled */
  const seg = LEG_MI[i], cum = CUM[i];
  let dhtml = seg.mi >= 1
    ? `<span class="dseg">↦ ${miFmt(seg.mi)} mi ${seg.mode} from last stop</span>`
    : `<span class="dseg dstay">↦ no travel — same locale</span>`;
  if (cum !== null)
    dhtml += `<span class="dsum">Σ since Damascus: <b>${miFmt(cum.tot)} mi</b>`
           + `<span class="sep"> — </span><span class="dl">${miFmt(cum.land)} on foot</span>`
           + `<span class="sep"> · </span><span class="ds">${miFmt(cum.sea)} by sea</span></span>`;
  document.getElementById("p-dist").innerHTML = dhtml;
  const bd = document.getElementById("p-badges");
  bd.innerHTML = "";
  (e.bg||[]).forEach(b => {
    const s = document.createElement("span");
    s.className = "badge" + (/uncertain|conjectural|approximate|tradition|debated|reconstructed|possible/i.test(b) ? " warn" : "");
    s.textContent = b;
    bd.appendChild(s);
  });
  document.getElementById("p-body").innerHTML = `<p>${e.body}</p>`;
  document.getElementById("p-alt").innerHTML =
    e.alt ? `<div class="altview"><b>Where scholars differ</b>${e.alt}</div>` : "";
  document.getElementById("p-letters").innerHTML =
    P[5].lt ? `<div class="lettersline">✉ Letters to this church: <b>${P[5].lt}</b></div>` : "";
  const rf = document.getElementById("p-refs");
  rf.innerHTML = "";
  e.refs.forEach(r => {
    const a = document.createElement("a");
    a.href = gw(r); a.target = "_blank"; a.rel = "noopener"; a.textContent = r;
    rf.appendChild(a);
  });
  const also = placeEvents[e.p].filter(j => j !== i);
  document.getElementById("p-also").innerHTML = also.length
    ? "Also at this place: " + also.map(j => `<a data-ev="${j}">${EVENTS[j].d} — ${EVENTS[j].t}</a>`).join(" · ")
    : "";
  document.querySelectorAll("#p-also a").forEach(a =>
    a.addEventListener("click", () => select(+a.dataset.ev)));
  document.querySelector("#panel .pbody").scrollTop = 0;
  document.getElementById("s-count").textContent = `${i+1} / ${EVENTS.length}`;
  /* year box */
  document.getElementById("yb-yr").textContent = e.d.match(/^c\./) ? e.d : "AD " + e.d.replace(/^[a-z]+ /i,"");
  document.getElementById("yb-ph").textContent = ph.name + " · " + ph.years;
  /* map */
  refreshLegs();
  for (const id in pinNodes){
    const n = pinNodes[id].n;
    n.classList.toggle("dim", false);
    n.classList.toggle("cur", id === e.p);   // static ring, outlives the pulse
  }
  /* restart the pulse on the next frame rather than forcing a synchronous
     reflow of the whole SVG just to flush the class change */
  halo.classList.remove("on");
  requestAnimationFrame(() => halo.classList.add("on"));
  positionHalo();
  if (!keepView) ensureVisible(pinNodes[e.p]);
  const n = legNodes[i];
  if (n && !EVENTS[i].leg.c && !REDUCED.matches){
    n.style.transition = "none";
    n.setAttribute("pathLength", 1);
    n.style.strokeDasharray = "1"; n.style.strokeDashoffset = "1";
    requestAnimationFrame(() => {
      n.style.transition = "stroke-dashoffset 0.9s ease";
      n.style.strokeDashoffset = "0";
    });
    setTimeout(() => { n.style.strokeDasharray = ""; n.style.strokeDashoffset = ""; n.style.transition = "none"; }, 1000);
  }
  /* timeline */
  evNodes.forEach((v,j) => v.g.classList.toggle("cur", j === i));
  cursorLine.setAttribute("x1", yrx(e.y)); cursorLine.setAttribute("x2", yrx(e.y));
  history.replaceState(null, "", "#e" + i);
}
function selectPlace(id){
  const list = placeEvents[id];
  if (!list) return;
  const after = list.find(j => j >= cur);
  select(list.includes(cur) ? list[(list.indexOf(cur)+1) % list.length] : (after !== undefined ? after : list[0]));
}
/* two sets of transport controls — the timeline's and the phone sheet's —
   drive the same handlers and stay in sync */
const playBtns = () => ["btn-play","s-play"].map(id => document.getElementById(id));
function stopPlay(){
  if (playTimer){ clearInterval(playTimer); playTimer = null;
    playBtns().forEach(b => b.textContent = "▶"); }
}
function togglePlay(){
  if (playTimer){ stopPlay(); return; }
  if (cur >= EVENTS.length-1) select(0);
  playBtns().forEach(b => b.textContent = "❚❚");
  playTimer = setInterval(() => {
    if (cur >= EVENTS.length-1) stopPlay(); else select(cur+1);
  }, 2600);
}
const bind = (ids, fn) => ids.forEach(id => document.getElementById(id).onclick = fn);
bind(["btn-next","s-next"],   () => { stopPlay(); select(cur+1); });
bind(["btn-prev","s-prev"],   () => { stopPlay(); select(cur-1); });
bind(["btn-first","s-first"], () => { stopPlay(); select(0); });
bind(["btn-play","s-play"],   togglePlay);

/* ---------- phone bottom sheet ----------
   Three snap heights. Tap the grab handle to cycle, or swipe it up/down.
   On desktop the bar is display:none, so none of this can fire. */
const SHEET = ["peek","half","full"];
let sheetIx = 1;
function setSheet(i){
  sheetIx = Math.min(Math.max(i, 0), SHEET.length - 1);
  SHEET.forEach((s, j) => document.body.classList.toggle("sheet-" + s, j === sheetIx));
}
setSheet(1);
{
  const grab = document.getElementById("s-grab");
  const cycle = () => setSheet((sheetIx + 1) % SHEET.length);
  grab.addEventListener("click", cycle);
  grab.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); cycle(); }
    if (ev.key === "ArrowUp"){ ev.preventDefault(); setSheet(sheetIx + 1); }
    if (ev.key === "ArrowDown"){ ev.preventDefault(); setSheet(sheetIx - 1); }
  });
  let startY = null;
  grab.addEventListener("touchstart", ev => { startY = ev.touches[0].clientY; }, {passive:true});
  grab.addEventListener("touchend", ev => {
    if (startY === null) return;
    const dy = ev.changedTouches[0].clientY - startY;
    startY = null;
    if (Math.abs(dy) < 24) return;          /* a tap — let the click handler run */
    ev.preventDefault();                     /* ...otherwise suppress the click */
    setSheet(sheetIx + (dy < 0 ? 1 : -1));
  }, {passive:false});
}

/* layers dropdown (phone) */
{
  const btn = document.getElementById("layers-btn");
  btn.addEventListener("click", ev => {
    ev.stopPropagation();
    const open = document.body.classList.toggle("layers-open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", ev => {
    if (!document.body.classList.contains("layers-open")) return;
    if (ev.target.closest("#layers")) return;
    document.body.classList.remove("layers-open");
    btn.setAttribute("aria-expanded", "false");
  });
}
document.addEventListener("keydown", ev => {
  if (ev.key === "ArrowRight"){ stopPlay(); select(cur+1); }
  if (ev.key === "ArrowLeft"){ stopPlay(); select(cur-1); }
  if (ev.key === "+" || ev.key === "=") zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1.5, 220);
  if (ev.key === "-" || ev.key === "_") zoomAt(vb.x+vb.w/2, vb.y+vb.h/2, 1/1.5, 220);
  if (ev.key === "0") resetVB();
});

/* ============================ LEGEND ============================ */
{
  const lb = document.getElementById("legendbody");
  const rows = [];
  rows.push(`<div class="sec">Journeys</div>`);
  /* labels come straight from PHASES so legend and timeline can never disagree */
  [2,3,4,6,1].forEach(p =>
    rows.push(`<div class="row"><span class="sw" style="border-color:${PHASES[p].color}"></span>${PHASES[p].name} (${PHASES[p].years})</div>`));
  rows.push(`<div class="row"><span class="sw dash" style="border-color:${PHASES[7].color}"></span>Conjectural / tradition</div>`);
  rows.push(`<div class="sec">Rome's map, c. AD 50</div>`);
  [["it","Italia"],["sen","Senatorial province"],["imp","Imperial province"],["cli","Client kingdom"]]
    .forEach(([k,l]) => rows.push(`<div class="row"><span class="box" style="background:${PROV_FILL[k]}"></span>${l}</div>`));
  rows.push(`<div class="sec">Marks</div>`);
  rows.push(`<div class="row"><svg width="14" height="12"><circle cx="7" cy="6" r="4.5" fill="#8a3a2b" stroke="#5c2317" stroke-width="1.2"/></svg>Church planted / community</div>`);
  rows.push(`<div class="row"><svg width="14" height="12"><circle cx="7" cy="6" r="4.5" fill="#f7f5f0" stroke="#43392b" stroke-width="1.2"/></svg>Place on Paul's road</div>`);
  rows.push(`<div class="row"><svg width="14" height="12"><circle cx="7" cy="6" r="4.5" fill="#f7f5f0" stroke="#2e5f7d" stroke-width="1.2" stroke-dasharray="2 1.5"/></svg>Church by letter only (Colossae)</div>`);
  rows.push(`<div class="row">✉ after a name — received Paul's letters</div>`);
  rows.push(`<div class="row"><span class="sw dash" style="border-color:#5f7286;border-top-width:1px"></span>Modern borders&nbsp; · &nbsp;<svg width="10" height="10"><rect x="2.5" y="2.5" width="5" height="5" transform="rotate(45 5 5)" fill="#f7f5f0" stroke="#5f7286"/></svg>&nbsp;modern city</div>`);
  rows.push(`<div class="note">Fifty events in the life of Paul, drawn from Acts and the letters. Dates are approximate and the chronology is one reconstruction among several — panels marked <i>Where scholars differ</i> flag the points where the evidence genuinely runs both ways. The overall sequence follows N.T. Wright, <i>Paul: A Biography</i> (HarperOne, 2018). Province boundaries are schematic. Distances are rough great-circle estimates along the drawn route, totalled from the Damascus Road.<br><br>Map by Tim Anderson. Not affiliated with or endorsed by the author or publisher. Basemap from Natural Earth (public domain). Scripture links go to Bible Gateway.<br><br><b>Getting around:</b> drag to pan · scroll or pinch to zoom · double-click to zoom in (shift to zoom out) · <b>+</b> / <b>−</b> / <b>0</b> to zoom and reset · <b>←</b> / <b>→</b> to step through events. Zoom out for the wider Roman world.</div>`);
  lb.innerHTML = rows.join("");
}

/* ============================ INIT ============================ */
applyVB();
const m = location.hash.match(/^#e(\d+)$/);
/* keepView on the first draw: the default CORE framing is deliberate, don't nudge it */
select(m ? Math.min(+m[1], EVENTS.length-1) : 0, true);
</script>
</body>
</html>
